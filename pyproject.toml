[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-ai"
version = "0.1.0"
description = "Developer productivity platform: sandboxed test execution, failure analysis, AI-assisted fixes with human review."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.36,<2.2",
    "alembic>=1.14,<2",
    "httpx>=0.27,<1",
    "typer>=0.12",
    "defusedxml>=0.7,<1",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-defusedxml",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "check-jsonschema>=0.29",
]

[project.scripts]
devflow = "devflow.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["devflow*"]

[tool.setuptools.package-data]
devflow = ["migrations/*.py", "migrations/versions/*.py", "migrations/script.py.mako", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"
timeout = 120
markers = [
    "docker: requires a running Docker engine and the devflow-runner image",
    "ai_live: calls a real AI CLI (opt-in, consumes subscription usage)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# E501: `ruff format` owns line length; long string literals are left intact.
ignore = ["S101", "S603", "S607", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S104", "S105", "S106", "S108", "S311"]
"benchmarks/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["devflow"]
mypy_path = "backend"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opentelemetry.instrumentation.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["devflow"]
omit = ["backend/devflow/migrations/*"]

[tool.bandit]
exclude_dirs = ["backend/tests", "examples", "frontend", ".venv"]
skips = ["B101", "B404", "B603"]

[tool.ruff.lint.isort]
known-first-party = ["devflow"]
