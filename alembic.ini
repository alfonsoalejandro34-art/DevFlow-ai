# Used only for generating new migrations: `alembic revision --autogenerate -m "..."`.
# The application applies migrations itself on startup (Database.migrate).
[alembic]
script_location = backend/devflow/migrations
prepend_sys_path = backend
sqlalchemy.url = sqlite:///.devflow/devflow.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
