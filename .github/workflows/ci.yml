name: CI

# `pull_request` (not `pull_request_target`): fork PRs run with a read-only token and no
# repository secrets. This workflow uses no secrets and never publishes or deploys.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check backend benchmarks scripts
      - name: Ruff format check
        run: ruff format --check backend benchmarks scripts
      - name: mypy (strict)
        run: mypy
      - name: Tests
        run: >
          pytest -m "not docker and not ai_live and not e2e"
          --cov --cov-report=xml --cov-report=term-missing:skip-covered
          --junitxml=test-results/backend.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-results-py${{ matrix.python }}
          path: |
            test-results/
            coverage.xml
          retention-days: 14

  docker-sandbox:
    name: Docker sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Build runner image
        run: docker build -t devflow-runner:0.1 runner/
      - name: Sandbox tests
        run: pytest -m docker -v --junitxml=test-results/docker.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-results
          path: test-results/
          retention-days: 14

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          python -m pip install -e '.[dev,e2e]'
          python -m playwright install --with-deps chromium-headless-shell
          cd frontend && npm ci
      - name: Build dashboard
        working-directory: frontend
        run: npm run build
      - name: Browser tests
        run: pytest -m e2e -v --junitxml=test-results/e2e.xml
      - name: Upload results and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Component tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Upload dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: frontend/dist
          retention-days: 7

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Bandit (static security analysis)
        run: bandit -q -c pyproject.toml -r backend/devflow
      - name: pip-audit (Python dependency vulnerabilities)
        run: pip-audit --skip-editable --progress-spinner off
      - name: npm audit (frontend dependency vulnerabilities)
        working-directory: frontend
        run: npm ci && npm audit --audit-level=moderate
      - name: Validate workflow files
        run: check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
